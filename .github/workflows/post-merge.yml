name: Post merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: stream-s3-sqs-post-merge

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: tests
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@bc6ed6b7584f8ffa2049f546d0d4534cbb5cc5e0
