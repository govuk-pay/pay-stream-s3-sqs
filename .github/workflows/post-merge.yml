name: Post merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: stream-s3-sqs-post-merge

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: tests
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@c1bed255fa76164f86f2b0f0f20df26ea58ab1c6
