name: Post merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: stream-s3-sqs-post-merge

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml

  release:
    needs: tests
    name: Release
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
